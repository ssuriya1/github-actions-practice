name: CI Pipeline

on: 
    workflow_dispatch:
        inputs:
            Environment: 
              type: number

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for Linux
        run: |
          docker build -t my-app-linux -f Dockerfile.linux .

      - name: Run tests in Docker container
        run: |
          docker run --rm my-app-linux npm test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image for Windows
        run: |
          docker build -t my-app-windows -f Dockerfile.windows .

      - name: Run tests in Docker container
        run: |
          docker run --rm my-app-windows npm test
