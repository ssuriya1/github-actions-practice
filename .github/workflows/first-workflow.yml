name: First Workflow 
on: 
  workflow_dispatch:
    inputs:
      name: 
        required: true
        type: choice
        options:
          - env1
          - env2
          - env3
      
      id: 
        required: false
        type: string
        default: xxxxx-xxxxx-xxxx


jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Failure
        run: |
          echo "Simulating failure"
          exit 1  # This step causes the job to fail.

  second_job:
    runs-on: ubuntu-latest
    needs: builds
    if: ${{ needs.builds.result == 'failure' }} # Ensures this job runs only on failure.

    steps:
      - name: Output Failure Information
        run: |
          echo "Builds job failed."
          echo "Result: ${{ needs.builds.result }}"
