name: Dynamic Matrix

on:
  workflow_dispatch:
    inputs:
      file_list:
        type: string
        description: 'test inputs'
        required: true
        default: 'test1,test2'
      max_parallel:
        type: number
        description: 'Maximum parallel jobs'
        required: true
        default: 2

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
      adjusted_max_parallel: ${{ steps.build-matrix.outputs.adjusted_max_parallel }}
    steps:
      - name: Generate Matrix JSON
        id: build-matrix
        run: |
          FILE_LIST="${{ inputs.file_list }}"
          COUNT=$(echo $FILE_LIST | tr -cd ',' | wc -c)
          COUNT=$((COUNT + 1))
          echo "Count: $COUNT"
          MATRIX=$(echo "[ $(echo $FILE_LIST | sed 's/,/\",\"/g' | sed 's/^/\"/;s/$/\"/') ]")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Adjust max_parallel based on count
        id: adjust-max-parallel
        run: |
          FILE_COUNT=${{ steps.build-matrix.outputs.count }}
          INPUT_COUNT=${{ inputs.max_parallel }}
          
          # Adjust max_parallel
          if [[ "$INPUT_COUNT" -lt "$FILE_COUNT" ]]; then
            ADJUSTED_COUNT=$FILE_COUNT
          else
            ADJUSTED_COUNT=$INPUT_COUNT
          fi
          
          echo "Adjusted max_parallel: $ADJUSTED_COUNT"
          echo "adjusted_max_parallel=$ADJUSTED_COUNT" >> $GITHUB_OUTPUT

  run-matrix-jobs:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ fromJson(needs.setup-matrix.outputs.adjusted_max_parallel) }}
      matrix:
        file: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Process File
        run: |
          echo "Processing file: ${{ matrix.file }}"
