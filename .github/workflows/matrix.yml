name: Dynamic Matrix

on:
  workflow_dispatch:
    inputs:
      file_list:
        type: string
        description: 'Comma-separated list of XML files'
        required: true
        default: 'test1,test2'
      max_parallel:
        type: string
        description: 'Maximum parallel jobs'
        required: true
        default: '2'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
    steps:
      - name: Generate Matrix JSON
        id: build-matrix
        run: |
          FILE_LIST="${{ inputs.file_list }}"
          COUNT=$(echo $FILE_LIST | tr -cd ',' | wc -c)
          COUNT=$((COUNT + 1))
          echo "Count: $COUNT"
          MATRIX=$(echo "[ $(echo $FILE_LIST | sed 's/,/\",\"/g' | sed 's/^/\"/;s/$/\"/') ]")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
      
      - name: Log Count
        run: |
          echo "File count: ${{ steps.build-matrix.outputs.count }}"

  run-matrix-jobs:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        file: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Process File
        run: |
          echo "Processing file: ${{ matrix.file }}"
