name: Dynamic Matrix
 
on:
  workflow_dispatch:
    inputs:
      file_list:
        description: "Comma-separated list of XML files"
        required: true
        default: "ndc_17_2_FlowTest_e2e_pack1.xml,ndc_17_2_FlowTest_e2e_pack2.xml"
 
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        run: |
          # Get the input value
          FILE_LIST="${{ github.event.inputs.file_list }}"
          
          # Convert the comma-separated list into a JSON array
          MATRIX=$(echo "[ $(echo $FILE_LIST | sed 's/,/\",\"/g' | sed 's/^/\"/;s/$/\"/') ]")
          
          # Output the matrix JSON
          echo "Matrix JSON: $MATRIX"
          echo "::set-output name=matrix::$MATRIX"
        id: build-matrix
 
  run-matrix-jobs:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Process File
        run: |
          echo "Processing file: ${{ matrix.file }}"