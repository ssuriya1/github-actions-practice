name: Dynamic Matrix

on:
  workflow_dispatch:
    inputs:
      file_list:
        type: string
        description: 'Comma-separated list of XML files'
        required: true
        default: 'test1,test2'
      max_parallel:
        type: string
        required: true

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Generate Matrix JSON
        run: |
          FILE_LIST="${{ inputs.file_list }}"
          MATRIX=$(echo "[ $(echo $FILE_LIST | sed 's/,/\",\"/g' | sed 's/^/\"/;s/$/\"/') ]")
          echo "Matrix JSON: $MATRIX"
          echo "matrix::$MATRIX" >> GITHUB_OUTPUT
        id: build-matrix

  run-matrix-jobs:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        file: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Process File
        run: |
          echo "Processing file: ${{ matrix.file }}"
