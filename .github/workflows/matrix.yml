name: Dynamic Matrix Strategy Example

on:
  workflow_dispatch:
    inputs:
      fruits:
        description: 'Comma-separated list of fruits'
        required: true
        default: 'apple,banana,orange'

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      fruits: ${{ steps.split-output.outputs.fruits }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Split fruits string into array
        id: split-output
        run: |
          fruits="${{ github.event.inputs.fruits }}"
          # Split the string by commas and format as a JSON array
          fruits_array=$(echo $fruits | tr ',' '\n' | jq -R . | jq -s .)
          echo "fruits=$fruits_array" >> $GITHUB_ENV
          echo "fruits_array=$fruits_array" >> $GITHUB_ENV
          echo "::set-output name=fruits::$fruits_array" # Set the output for later use
  
  run-matrix:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fruit: ${{ fromJson(needs.prepare-matrix.outputs.fruits) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Display fruit from matrix
        run: |
          echo "The fruit is ${{ matrix.fruit }}"
