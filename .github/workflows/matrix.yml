name: Dynamic Matrix

on:
  workflow_dispatch:
    inputs:
      file_list:
        type: string
        description: 'Comma-separated list of XML files'
        required: true
        default: 'test1,test2'
      max_parallel:
        type: number
        description: 'Maximum parallel jobs'
        required: true
        default: '2'

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      count: ${{ steps.build-matrix.outputs.count }}
    steps:
      - name: Generate Matrix JSON
        id: build-matrix
        run: |
          FILE_LIST="${{ inputs.file_list }}"
          COUNT=$(echo $FILE_LIST | tr -cd ',' | wc -c)
          COUNT=$((COUNT + 1))
          echo "Count: $COUNT"
          MATRIX=$(echo "[ $(echo $FILE_LIST | sed 's/,/\",\"/g' | sed 's/^/\"/;s/$/\"/') ]")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Log Count
        run: |
          FILE_COUNT=${{ steps.build-matrix.outputs.count }}
          INPUT_COUNT=${{ inputs.max_parallel }}
          if [[ "$FILE_COUNT" =~ ^[0-9]+$ ]] && [[ "$INPUT_COUNT" =~ ^[0-9]+$ ]]; then
            if [ "$INPUT_COUNT" -le "$FILE_COUNT" ]; then
              FILE_COUNT="$INPUT_COUNT"
            else
              echo "File count is greater than input count"
            fi
          else
            echo "One or both variables are not valid numbers."
          fi
          echo "count=$FILE_COUNT" >> $GITHUB_OUTPUT

  run-matrix-jobs:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: ${{ fromJson(needs.setup-matrix.outputs.count) }}
      matrix:
        file: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - name: Process File
        run: |
          echo "Processing file: ${{ matrix.file }}"
