name: Job Outputs Example

on: 
    # push
    workflow_dispatch

jobs:
  generate-number:
    runs-on: ubuntu-latest
    outputs:
      random_number: ${{ steps.generated-number.outputs.generate-output }}
    steps:
      - name: Generate random number
        id: generated-number
        run: echo generate-output=$((RANDOM % 100))  >> $GITHUB_OUTPUT

  use-number:
    runs-on: ubuntu-latest
    needs: generate-number
    steps:
      - name: Print the random number
        run: |
            echo "The random number is: ${{ needs.generate-number.outputs.random_number }}"

  set-files:
    runs-on: ubuntu-latest
    outputs:
      file_path: ${{ steps.set_output.outputs.file }}

    steps:
      - name: Create a file
        run: echo "Hello" > hello.txt

      - name: Set output
        id: set_output
        run: echo "file=$(pwd)/hello.txt" >> $GITHUB _OUTPUT

  get-files:
    needs: set-files
    runs-on: ubuntu-latest
    steps:
      - name: Use the file from set-files
        run: cat ${{ needs.set-files.outputs.file_path }}
  
