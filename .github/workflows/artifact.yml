name: Multi-Artifact Workflow
on: [push, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        files: [artifact1.txt, artifact2.txt, artifact3.txt]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create multiple artifacts
        run: |
          # Create artifacts with different names and contents
          echo "Artifact 1 content" > artifact1.txt
          echo "Artifact 2 content" > artifact2.txt
          echo "Artifact 3 content" > artifact3.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: my-artifacts
          path: ${{ matrix.files }}

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          name: my-artifacts

      - name: List downloaded artifacts
        run: |
          ls -R
