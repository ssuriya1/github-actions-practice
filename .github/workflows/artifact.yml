name: Multi-Artifact Workflow

on: [push, workflow_dispatch]

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create multiple artifacts
        run: |
          echo "Artifact 1 content" > artifact1.txt
          echo "Artifact 2 content" > artifact2.txt
          echo "Artifact 3 content" > artifact3.txt

          echo "Uploading artifact 1..."
          echo "::set-output name=artifact1_path::artifact1.txt"
          echo "Uploading artifact 2..."
          echo "::set-output name=artifact2_path::artifact2.txt"
          echo "Uploading artifact 3..."
          echo "::set-output name=artifact3_path::artifact3.txt"

  job2:
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download and store artifacts
        run: |
          artifact1_path="${{ jobs.job1.outputs.artifact1_path }}"
          artifact2_path="${{ jobs.job1.outputs.artifact2_path }}"
          artifact3_path="${{ jobs.job1.outputs.artifact3_path }}"

          echo "Downloading artifact 1..."
          curl -o artifact1.txt ${{ runner.artifacts.downloads }}/"$artifact1_path"
          echo "Downloading artifact 2..."
          curl -o artifact2.txt ${{ runner.artifacts.downloads }}/"$artifact2_path"
          echo "Downloading artifact 3..."
          curl -o artifact3.txt ${{ runner.artifacts.downloads }}/"$artifact3_path"

          echo "Downloaded artifacts:"
          ls -l artifact1.txt artifact2.txt artifact3.txt
